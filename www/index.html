<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A dependency-free terminal coding agent." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Drinky" />
    <meta property="og:description" content="A dependency-free terminal coding agent." />
    <meta property="og:url" content="https://drinky.dev/" />
    <title>Drinky</title>
    <link rel="icon" type="image/png" href="drinky.png" />
    <style>
      :root {
        --bg: #0b0d11;
        --fg: #e8eaee;
        --muted: #8b919c;
        --accent: #5fd4d4;
        --user: #d47fd4;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f6f3;
          --fg: #15171b;
          --muted: #6b717b;
          --accent: #0f8f8f;
          --user: #9b3b9b;
        }
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans",
          Helvetica,
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        overflow-x: hidden;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .logo {
        display: block;
        width: min(92vw, 56vh);
        height: auto;
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 600;
        line-height: 1.25;
      }

      p {
        margin: 0;
        max-width: 34ch;
        color: var(--muted);
      }

      a {
        color: var(--fg);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.25em;
      }

      a:hover {
        text-decoration-color: var(--user);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="drinky.png" alt="Drinky" width="1254" height="1254" />
      <h1>Drinky</h1>
      <p>A dependency-free terminal coding agent.</p>
      <p><a href="https://github.com/clebert/drinky">github.com/clebert/drinky</a></p>
    </main>
  </body>
</html>
